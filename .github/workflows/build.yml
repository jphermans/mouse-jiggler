name: Build

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ── Windows (x64) ─────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --noconsole --name "MouseJiggler" --add-data "mouse_jiggler.ico;." mouse_jiggler.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: MouseJiggler-Windows
          path: dist/MouseJiggler.exe
          retention-days: 30

  # ── macOS (Apple Silicon) ──────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name "MouseJiggler" --add-data "mouse_jiggler.ico:." mouse_jiggler.py

      - name: Package as zip
        run: |
          cd dist
          zip -r MouseJiggler-macOS.zip MouseJiggler.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: MouseJiggler-macOS
          path: dist/MouseJiggler-macOS.zip
          retention-days: 30

  # ── Linux (x64, glibc 2.35+) ──────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04  # oldest available for broad glibc compatibility

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name "MouseJiggler" --add-data "mouse_jiggler.ico:." mouse_jiggler.py

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: MouseJiggler-Linux
          path: dist/MouseJiggler
          retention-days: 30

  # ── Release (tag push only) ───────────────────────────────────────────
  release:
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: MouseJiggler-*
          merge-multiple: true
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/MouseJiggler.exe
            artifacts/MouseJiggler-macOS.zip
            artifacts/MouseJiggler
          generate_release_notes: true
