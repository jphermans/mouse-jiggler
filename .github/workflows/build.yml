name: Build

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ── Windows (x64) ─────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'
      - name: Build with .NET
        run: |
          mkdir dist
          dotnet publish MouseJiggler.Windows.csproj `
            -c Release `
            -r win-x64 `
            -p:PublishSingleFile=true `
            -p:AssemblyName=MouseJiggler `
            -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: MouseJiggler-Windows
          path: dist/MouseJiggler.exe
          retention-days: 1

  # ── macOS (Apple Silicon) ──────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ObjC binary
        run: |
          mkdir -p dist
          clang -O2 \
            -framework Cocoa \
            -framework CoreGraphics \
            -framework ServiceManagement \
            -o dist/MouseJiggler \
            mouse_jiggler_macos.m

      - name: Verify binary
        run: |
          file dist/MouseJiggler
          otool -L dist/MouseJiggler | head -10
          ls -la dist/MouseJiggler

      - name: Create .app bundle
        run: |
          APP="Mouse Jiggler"
          BUNDLE="dist/$APP.app"
          mkdir -p "$BUNDLE/Contents/MacOS"
          mkdir -p "$BUNDLE/Contents/Resources"
          cp dist/MouseJiggler "$BUNDLE/Contents/MacOS/$APP"
          chmod +x "$BUNDLE/Contents/MacOS/$APP"
          cp AppIcon.icns "$BUNDLE/Contents/Resources/AppIcon.icns"
          python3 -c "
          import plistlib
          pl = {
              'CFBundleExecutable': '$APP',
              'CFBundleIdentifier': 'com.jphermans.mouse-jiggler',
              'CFBundleName': '$APP',
              'CFBundleDisplayName': '$APP',
              'CFBundlePackageType': 'APPL',
              'CFBundleVersion': '1.0.0',
              'CFBundleShortVersionString': '1.0.0',
              'CFBundleIconFile': 'AppIcon',
              'LSUIElement': True,
              'NSHighResolutionCapable': True,
          }
          with open('$BUNDLE/Contents/Info.plist', 'wb') as f:
              plistlib.dump(pl, f)
          "
          codesign --force --deep --sign - "$BUNDLE"
          rm dist/MouseJiggler

      - name: Package as zip
        run: |
          cd dist
          zip -r MouseJiggler-macOS.zip "Mouse Jiggler.app"

      - uses: actions/upload-artifact@v4
        with:
          name: MouseJiggler-macOS
          path: dist/MouseJiggler-macOS.zip
          retention-days: 1
  # ── Linux (x64) ────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Install build deps
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq libx11-dev
      - name: Build with Go
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -ldflags="-s -w" -o dist/MouseJiggler mouse_jiggler_linux.go
      - uses: actions/upload-artifact@v4
        with:
          name: MouseJiggler-Linux
          path: dist/MouseJiggler
          retention-days: 1

  # ── Release (tag push only) ───────────────────────────────────────────
  release:
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: MouseJiggler-*
          merge-multiple: true
          path: artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/MouseJiggler.exe
            artifacts/MouseJiggler-macOS.zip
            artifacts/MouseJiggler
          generate_release_notes: true
