name: Build

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ── Windows (x64) ─────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: |
          pyinstaller --onefile --windowed --noconsole --name "MouseJiggler" --add-data "mouse_jiggler.ico;." mouse_jiggler.py
      - uses: actions/upload-artifact@v4
        with:
          name: MouseJiggler-Windows
          path: dist/MouseJiggler.exe
          retention-days: 30

  # ── macOS (Apple Silicon) ──────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ObjC binary
        run: |
          mkdir -p dist
          clang -O2 \
            -framework Cocoa \
            -framework CoreGraphics \
            -framework ServiceManagement \
            -o dist/MouseJiggler \
            mouse_jiggler_macos.m

      - name: Verify binary
        run: |
          file dist/MouseJiggler
          otool -L dist/MouseJiggler | head -10
          ls -la dist/MouseJiggler

      - name: Create .app bundle
        run: |
          APP="Mouse Jiggler"
          BUNDLE="dist/$APP.app"
          mkdir -p "$BUNDLE/Contents/MacOS"
          mkdir -p "$BUNDLE/Contents/Resources"
          cp dist/MouseJiggler "$BUNDLE/Contents/MacOS/$APP"
          chmod +x "$BUNDLE/Contents/MacOS/$APP"
          cp AppIcon.icns "$BUNDLE/Contents/Resources/AppIcon.icns"
          python3 -c "
          import plistlib
          pl = {
              'CFBundleExecutable': '$APP',
              'CFBundleIdentifier': 'com.jphermans.mouse-jiggler',
              'CFBundleName': '$APP',
              'CFBundleDisplayName': '$APP',
              'CFBundlePackageType': 'APPL',
              'CFBundleVersion': '1.0.0',
              'CFBundleShortVersionString': '1.0.0',
              'CFBundleIconFile': 'AppIcon',
              'LSUIElement': True,
              'NSHighResolutionCapable': True,
          }
          with open('$BUNDLE/Contents/Info.plist', 'wb') as f:
              plistlib.dump(pl, f)
          "
          codesign --force --deep --sign - "$BUNDLE"
          rm dist/MouseJiggler

      - name: Package as zip
        run: |
          cd dist
          zip -r MouseJiggler-macOS.zip "Mouse Jiggler.app"

      - uses: actions/upload-artifact@v4
        with:
          name: MouseJiggler-macOS
          path: dist/MouseJiggler-macOS.zip
          retention-days: 30

  # ── Linux (x64, glibc 2.35+) ──────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
      - run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt
      - run: |
          pyinstaller --onefile --windowed --name "MouseJiggler" --add-data "mouse_jiggler.ico:." mouse_jiggler.py
      - uses: actions/upload-artifact@v4
        with:
          name: MouseJiggler-Linux
          path: dist/MouseJiggler
          retention-days: 30

  # ── Release (tag push only) ───────────────────────────────────────────
  release:
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: MouseJiggler-*
          merge-multiple: true
          path: artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/MouseJiggler.exe
            artifacts/MouseJiggler-macOS.zip
            artifacts/MouseJiggler
          generate_release_notes: true
